name: Update Manga Wiser Data

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch AniList catalog
        run: python scripts/fetch_anilist.py

      - name: Generate latest releases data
        run: python scripts/fetch_releases.py

      - name: Save updated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/anilist-catalog.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Manga Wiser catalog"
            git push
          else
            echo "No catalog changes to commit."
          fi
